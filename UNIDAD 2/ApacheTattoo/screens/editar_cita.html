<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apache Tattoo Studio | Editar Cita</title>
    <link rel="icon" href="../assets/img/logo.svg" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Grenze:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
    <header class="header container">
        <h1 class="header__logo">Apache Tattoo Studio</h1>
        <nav>
            <ul class="header__list-nav">
                <li class="header__link"><a href="index.html">Inicio</a></li>
                <li class="header__link"><a href="productos.html">Productos</a></li>
                <li class="header__link"><a href="trabajos.html">Mis trabajos</a></li>
                <li class="header__link"><a href="clientes.html">Clientes</a></li>
                <li class="header__link header__link--active"><a href="citas.html">Citas</a></li>
                <li class="header__link"><a href="artistas.html">Artistas</a></li>
                <li class="header__link"><a href="administracion.html">Administración</a></li>
            </ul>
        </nav>
    </header>
    <main class="container flex flex--center flex--column">
        <section class="card cadastro">
            <h1 class="card__title">Editar Cita</h1>
            <form class="flex flex--column" data-form>
                <div class="input-container">
                    <input name="cliente" id="cliente" class="input" type="text" placeholder="Cliente" required data-cliente />
                    <label class="input-label" for="cliente">Cliente</label>
                    <span class="input-menssage-error">Este campo es requerido</span>
                </div>
                <div class="input-container">
                    <input name="fecha" id="fecha" class="input" type="date" placeholder="Fecha" required data-fecha />
                    <label class="input-label" for="fecha">Fecha</label>
                    <span class="input-menssage-error">Este campo es requerido</span>
                </div>
                <div class="input-container">
                    <input name="hora" id="hora" class="input" type="time" placeholder="Hora" required data-hora />
                    <label class="input-label" for="hora">Hora</label>
                    <span class="input-menssage-error">Este campo es requerido</span>
                </div>
                <button type="submit" class="button">Guardar cambios</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <p class="footer__text">Apache Tattoo Studio &copy; 2025 - Todos los derechos reservados</p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js" integrity="sha512-UNM1njAgOFUa74Z0bADwAq8gbTcqZC8Ej4xPSzpnh0l6KMevwvkBvbldF9uR++qKeJ+MOZHRjV1HZjoRvjDfNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="../controllers/actualizar-cita-controller.js"></script>
</body>
</html>
