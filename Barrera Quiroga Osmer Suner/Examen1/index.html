<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación DOM</title>
    <style>
        .task { padding: 10px; margin: 5px; border: 1px solid #ccc; }
        .relleno { background-color: yellow; }
        .tachado { text-decoration: line-through; color: #999; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="ventana">
        <div id="container">
            <h2>Lista de Tareas</h2>
            <input type="text" id="newItem" placeholder="Nueva tarea" data-input>
            <button id="addBtn" data-btn-add>Agregar</button>
            <ul id="taskList" data-list>
                <li class="item">Tarea de ejemplo 1</li>
                <li class="item">Tarea de ejemplo 2</li>
            </ul>
            
            <div id="controls">
                <button id="toggleBtn" data-btn-tachar>Tachar Último</button>
                <button id="countBtn"data-btn-contar>Contar Items</button>
            </div>
            <div id="output" data-ouput></div>
        </div>
    </section>
</main>
    
    
    
    <script type="module" src="script.js"></script>
</body>
</html>
